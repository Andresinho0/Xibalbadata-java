spring.application.name=xibalba-data

# Configuración del servidor (Dinámico para Railway)
server.port=${PORT:8080}
server.address=0.0.0.0

# Conexión a la Base de Datos (Nube / Respaldo Local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xibalbadata}
spring.datasource.username=${DB_USER:andres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.keepaliveTime=240000

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Logs
logging.level.org.hibernate.SQL=DEBUG
# Parámetros SQL (incluyen hashes de contraseña). Solo activar en local con SQL_PARAMS_LOG=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_PARAMS_LOG:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${SQL_PARAMS_LOG:INFO}

# Envío de correo (Resend). Configurar RESEND_API_KEY y RESEND_FROM en Railway
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}
